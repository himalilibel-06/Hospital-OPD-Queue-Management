<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Queue Manager – SmartOPD</title>
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">

  <style>
    /* ==========================================================================
       Live Queue Manager Styles
       ========================================================================== */
    .manager-toolbar {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 24px;
      background: #FFFFFF;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
    }

    .toolbar-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    /* Demo Clock Bar */
    .demo-clock-box {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: linear-gradient(135deg, rgba(15, 118, 110, 0.08) 0%, rgba(56, 189, 248, 0.12) 100%);
      border: 1px solid rgba(15, 118, 110, 0.25);
      border-radius: var(--radius-sm);
      flex-wrap: wrap;
    }

    .demo-clock-label-group {
      display: flex;
      flex-direction: column;
    }

    .demo-clock-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--primary-teal);
    }

    .demo-clock-time {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--navy-dark);
      font-family: var(--font-mono);
    }

    .demo-clock-btn-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-clock {
      padding: 4px 9px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: var(--radius-xs);
      background: #FFFFFF;
      border: 1px solid var(--border-medium);
      color: var(--navy-dark);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .btn-clock:hover {
      background: var(--primary-teal);
      color: #FFFFFF;
      border-color: var(--primary-teal);
    }

    .btn-clock-reset {
      background: transparent;
      border-color: transparent;
      color: var(--text-muted);
    }

    .btn-clock-reset:hover {
      background: rgba(220, 38, 38, 0.1);
      color: var(--sev-5-emergency);
    }

    /* Doctor Filter Tabs */
    .doctor-tabs-row {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-light);
      background: var(--bg-page);
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      white-space: nowrap;
      transition: all var(--transition-fast);
    }

    .tab-btn:hover {
      background: #FFFFFF;
      border-color: var(--primary-teal);
    }

    .tab-btn.active {
      background: var(--navy-dark);
      color: #FFFFFF;
      border-color: var(--navy-dark);
    }

    .tab-btn .tab-count-pill {
      font-size: 0.6875rem;
      padding: 1px 6px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.2);
    }

    .tab-btn:not(.active) .tab-count-pill {
      background: #E2E8F0;
      color: var(--navy-dark);
    }

    /* Main Grid: Queue Columns + Right Explanation Log */
    .manager-main-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 24px;
      align-items: flex-start;
    }

    /* Doctor Queue Card */
    .doctor-queue-column {
      background: #FFFFFF;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      margin-bottom: 24px;
      transition: border-color var(--transition-fast);
    }

    .queue-column-header {
      padding: 16px 20px;
      background: #F8FAFC;
      border-bottom: 1px solid var(--border-light);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .doc-headline h3 {
      font-size: 1.05rem;
      margin-bottom: 2px;
    }

    /* Current Patient Banner inside Column */
    .in-consultation-banner {
      padding: 14px 20px;
      background: linear-gradient(90deg, #F0FDFA 0%, #FFFFFF 100%);
      border-bottom: 1px solid #CCFBF1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .consult-pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--status-consulting);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.25);
      animation: pulse 1.8s infinite;
      flex-shrink: 0;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(13, 148, 136, 0.5); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(13, 148, 136, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(13, 148, 136, 0); }
    }

    .consult-timer {
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--primary-teal);
      background: #FFFFFF;
      padding: 3px 8px;
      border-radius: var(--radius-xs);
      border: 1px solid #99F6E4;
    }

    /* Queue Table Row Animations */
    .queue-row {
      transition: background-color 0.4s ease, transform 0.3s ease;
    }

    .queue-row.row-flash {
      background-color: #FEF3C7 !important;
    }

    .queue-row.row-emergency {
      background-color: #FEF2F2;
    }

    .action-btn-link {
      padding: 3px 8px;
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: var(--radius-xs);
      border: 1px solid var(--border-medium);
      background: #FFFFFF;
      color: var(--navy-dark);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all var(--transition-fast);
      text-decoration: none;
    }

    .action-btn-link:hover {
      background: var(--bg-page);
      border-color: var(--primary-teal);
      text-decoration: none;
    }

    .action-btn-danger:hover {
      background: var(--sev-5-bg);
      border-color: var(--sev-5-emergency);
      color: var(--sev-5-emergency);
    }

    /* Right-hand Explanation Log Panel */
    .log-panel-sticky {
      position: sticky;
      top: 92px;
      background: #FFFFFF;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-light);
      box-shadow: var(--shadow-md);
      overflow: hidden;
      max-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
    }

    .log-panel-header {
      padding: 16px 20px;
      background: #0B2545;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .log-panel-header h3 {
      font-size: 0.95rem;
      color: #FFFFFF;
      margin-bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .log-feed-container {
      overflow-y: auto;
      flex: 1;
      padding: 12px;
    }

    .log-entry-item {
      padding: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-light);
      background: #FFFFFF;
      margin-bottom: 8px;
      font-size: 0.8125rem;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .log-entry-item.log-entry-new {
      animation: highlightFade 2.5s ease-out;
    }

    @keyframes highlightFade {
      0%   { background-color: #FEF3C7; border-color: #F59E0B; }
      100% { background-color: #FFFFFF; border-color: var(--border-light); }
    }

    .log-icon-pill {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .log-type-EMERGENCY_OVERRIDE { background: rgba(220, 38, 38, 0.15); color: #DC2626; }
    .log-type-FAIRNESS_BOOST    { background: rgba(124, 58, 237, 0.15); color: #7C3AED; }
    .log-type-MOVED_UP          { background: rgba(56, 189, 248, 0.2);  color: #0284C7; }
    .log-type-MOVED_DOWN        { background: rgba(245, 158, 11, 0.18); color: #D97706; }
    .log-type-CALLED            { background: rgba(15, 118, 110, 0.15); color: #0F766E; }
    .log-type-COMPLETED         { background: rgba(22, 163, 74, 0.15);  color: #16A34A; }
    .log-type-NO_SHOW           { background: rgba(100, 116, 139, 0.15); color: #64748B; }
    .log-type-SKIPPED           { background: rgba(249, 115, 22, 0.15); color: #EA580C; }

    .log-time-stamp {
      font-size: 0.6875rem;
      color: var(--text-muted);
      margin-left: auto;
      font-family: var(--font-mono);
    }

    @media (max-width: 1080px) {
      .manager-main-grid { grid-template-columns: 1fr; }
      .log-panel-sticky { position: static; max-height: 480px; }
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <!-- Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <a href="queue-manager.html" class="sidebar-brand">
          <div class="brand-logo-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <path d="M12 8v8M8 12h8"/>
            </svg>
          </div>
          <div class="brand-text-group">
            <span class="brand-name">Smart<span class="text-teal-accent">OPD</span></span>
            <span class="brand-subtext">Live Queue</span>
          </div>
        </a>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-section-title">QUEUE OPERATIONS</div>
        <ul class="nav-list" id="sidebar-nav-links">
          <!-- Populated by app.js -->
        </ul>
      </nav>

      <div class="sidebar-footer">
        <button class="sidebar-logout-btn" id="logout-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          <span>Sign Out</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="app-main">
      <header class="app-topbar">
        <div class="topbar-left">
          <button class="menu-toggle-btn" id="menu-toggle-btn" aria-label="Toggle Navigation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
          <div class="topbar-heading">
            <h1 class="page-title">Live OPD Queue Manager</h1>
            <span class="page-subtitle">Real-time Priority Queues, Dynamic Fairness Aging & Explainability Audit</span>
          </div>
        </div>

        <div class="topbar-right">
          <div class="live-clock-card" title="Current Hospital Time">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span id="live-clock">--:--:--</span>
          </div>

          <div class="user-profile-chip" id="user-chip"></div>
        </div>
      </header>

      <main class="app-content">
        
        <!-- Reconnecting and Error States -->
        <div id="qm-reconnecting-banner" style="display:none; padding:8px 16px; background:#FEF3C7; border:1px solid #F59E0B; border-radius:8px; color:#B45309; font-size:0.8125rem; font-weight:600; margin-bottom:16px;">
          Reconnecting to server...
        </div>

        <div id="qm-error-state" style="display:none; margin-bottom:20px;" class="card">
          <div class="card-body" style="padding:24px; text-align:center;">
            <p id="qm-error-msg" style="color:var(--sev-5-emergency); font-weight:600; margin-bottom:12px;"></p>
            <button type="button" class="btn btn-secondary btn-sm" id="btn-retry-qm">Retry</button>
          </div>
        </div>

        <!-- Top Toolbar: Filter Tabs + Search + Demo Clock Controls -->
        <div class="manager-toolbar">
          <div class="toolbar-top-row">
            <!-- Search Input -->
            <div style="flex: 1; max-width: 380px;">
              <div class="input-icon-wrapper">
                <span class="input-icon-left">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                  </svg>
                </span>
                <input type="text" id="queue-search-input" class="form-control has-left-icon" placeholder="Search patient name or token...">
              </div>
            </div>

            <!-- Demo Clock Control -->
            <div class="demo-clock-box">
              <div class="demo-clock-label-group">
                <span class="demo-clock-badge">Demo Clock – for presentations</span>
                <span class="demo-clock-time" id="demo-clock-display">10:00:00 AM</span>
              </div>

              <div class="demo-clock-btn-group">
                <button type="button" class="btn-clock" onclick="handleAdvanceClock(10)" title="Advance simulated time by 10 minutes">+10 min</button>
                <button type="button" class="btn-clock" onclick="handleAdvanceClock(30)" title="Advance simulated time by 30 minutes">+30 min</button>
                <button type="button" class="btn-clock" onclick="handleAdvanceClock(60)" title="Advance simulated time by 1 hour">+1 hr</button>
                <button type="button" class="btn-clock btn-clock-reset" onclick="handleResetClock()" title="Reset to real system time">Reset</button>
              </div>
            </div>
          </div>

          <!-- Doctor Filter Tabs -->
          <div class="doctor-tabs-row" id="doctor-tabs-container">
            <!-- Rendered dynamically -->
          </div>
        </div>

        <!-- Main Layout: Queue Columns (left) + Explanation Log (right) -->
        <div class="manager-main-grid">
          
          <!-- Columns Area -->
          <div id="doctor-columns-container">
            <!-- Rendered dynamically -->
          </div>

          <!-- Right-hand Sticky Explanation Log Panel -->
          <div class="log-panel-sticky">
            <div class="log-panel-header">
              <h3>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path>
                </svg>
                <span>Explanation & Event Log</span>
              </h3>
              <span class="badge" style="background: rgba(255,255,255,0.2); color:#FFFFFF; font-size:0.6875rem;" id="log-count-badge">Live</span>
            </div>

            <div class="log-feed-container" id="log-feed-container">
              <!-- Rendered dynamically -->
            </div>
          </div>

        </div>

      </main>
    </div>
  </div>

  <!-- Shared App & API Scripts -->
  <script src="js/api-client.js"></script>
  <script src="js/api-adapters.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Role Guard: Require Receptionist (Front Desk)
    SmartOPD.requireAuth(['Receptionist']);
    SmartOPD.initLayout('live-queue');

    let currentDoctorFilter = 'All';
    let cachedQueues = [];
    let cachedClock = null;
    let cachedEvents = [];
    let isActionInFlight = false;

    // 1. Fetch all data needed for Queue Manager
    async function fetchAllData() {
      const [rawQueues, rawClock, rawEvents] = await Promise.all([
        SmartOPDApi.get('/api/queues'),
        SmartOPDApi.get('/api/clock'),
        SmartOPDApi.get('/api/events?limit=30')
      ]);

      return {
        queues: SmartOPDAdapters.adaptQueues(rawQueues),
        clock: SmartOPDAdapters.adaptClock(rawClock),
        events: SmartOPDAdapters.adaptEvents(rawEvents)
      };
    }

    // 2. Render all components
    function renderAll() {
      renderDemoClock();
      renderDoctorTabs();
      renderQueueColumns();
      renderExplanationLog();
    }

    // 3. Refresh immediately after an action
    async function refreshImmediately() {
      try {
        const data = await fetchAllData();
        cachedQueues = data.queues;
        cachedClock = data.clock;
        cachedEvents = data.events;
        renderAll();
      } catch (err) {
        console.error('Queue manager refresh failed:', err);
      }
    }

    // 4. Demo Clock Display
    function renderDemoClock() {
      const clockEl = document.getElementById('demo-clock-display');
      if (!clockEl) return;

      if (!cachedClock) {
        clockEl.textContent = '--:--:--';
        return;
      }

      const timeStr = cachedClock.timeString || (cachedClock.currentTime ? cachedClock.currentTime.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }) : '--:--:--');
      const offset = cachedClock.offsetMinutes || 0;
      const offsetStr = offset > 0 ? ` (+${offset}m)` : '';
      clockEl.textContent = `${timeStr}${offsetStr}`;
    }

    async function handleAdvanceClock(mins) {
      if (isActionInFlight) return;
      isActionInFlight = true;

      try {
        await SmartOPDApi.post('/api/clock/advance', { minutes: mins });
        SmartOPD.showToast('Demo Clock Advanced', `Time shifted +${mins} mins. Queue priorities recomputed.`, 'info');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Clock Error', err.message || 'Failed to advance clock', 'error');
      } finally {
        isActionInFlight = false;
      }
    }

    async function handleResetClock() {
      if (isActionInFlight) return;
      isActionInFlight = true;

      try {
        await SmartOPDApi.post('/api/clock/reset', {});
        SmartOPD.showToast('Clock Reset', 'Simulated demo clock returned to real time.', 'info');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Clock Error', err.message || 'Failed to reset clock', 'error');
      } finally {
        isActionInFlight = false;
      }
    }

    // 5. Render Doctor Filter Tabs
    function renderDoctorTabs() {
      const container = document.getElementById('doctor-tabs-container');
      if (!container) return;

      let allWaiting = 0;
      cachedQueues.forEach(doc => {
        allWaiting += (doc.queue ? doc.queue.length : (doc.waitingCount || 0));
      });

      let html = `
        <button type="button" class="tab-btn ${currentDoctorFilter === 'All' ? 'active' : ''}" onclick="setDoctorFilter('All')">
          <span>All OPD Rooms</span>
          <span class="tab-count-pill">${allWaiting}</span>
        </button>
      `;

      cachedQueues.forEach(doc => {
        const queueCount = doc.queue ? doc.queue.length : (doc.waitingCount || 0);
        html += `
          <button type="button" class="tab-btn ${currentDoctorFilter === doc.id ? 'active' : ''}" onclick="setDoctorFilter('${doc.id}')">
            <span>${doc.name}</span>
            <span class="tab-count-pill">${queueCount}</span>
          </button>
        `;
      });

      container.innerHTML = html;
    }

    function setDoctorFilter(docId) {
      currentDoctorFilter = docId;
      renderDoctorTabs();
      renderQueueColumns();
      renderExplanationLog();
    }

    // 6. Render Queue Columns
    function renderQueueColumns() {
      const container = document.getElementById('doctor-columns-container');
      if (!container) return;

      const searchInput = document.getElementById('queue-search-input');
      const searchQuery = (searchInput ? searchInput.value : '').toLowerCase().trim();

      if (cachedQueues.length === 0) {
        container.innerHTML = `<div class="card p-4 text-center text-muted">Loading live queues...</div>`;
        return;
      }

      const filteredDoctors = currentDoctorFilter === 'All'
        ? cachedQueues
        : cachedQueues.filter(d => d.id === currentDoctorFilter);

      if (filteredDoctors.length === 0) {
        container.innerHTML = `<div class="card p-4 text-center text-muted">No doctors found for this filter.</div>`;
        return;
      }

      container.innerHTML = filteredDoctors.map(doc => {
        let statusBadge = `<span class="badge badge-completed">Available</span>`;
        if (doc.status === 'On Break') statusBadge = `<span class="badge badge-waiting">On Break</span>`;
        else if (doc.status === 'Off Duty') statusBadge = `<span class="badge" style="background:#E2E8F0; color:#64748B;">Off Duty</span>`;

        // Active Patient In Consultation
        let activePatientBanner = `
          <div class="in-consultation-banner" style="background: #FAFAFA; border-bottom: 1px solid var(--border-light);">
            <div style="display:flex; align-items:center; gap:10px;">
              <span class="text-xs text-muted">Room Status:</span>
              <span class="font-medium text-sm text-muted">No patient in room</span>
            </div>
            ${doc.status === 'Available' ? `
              <button class="btn btn-primary btn-sm" ${isActionInFlight ? 'disabled' : ''} onclick="handleCallNext('${doc.id}', this)">Call Next Patient</button>
            ` : ''}
          </div>
        `;

        if (doc.activePatient) {
          const ap = doc.activePatient;
          activePatientBanner = `
            <div class="in-consultation-banner">
              <div style="display:flex; align-items:center; gap:10px;">
                <div class="consult-pulse-dot" title="Active Consultation in Progress"></div>
                <div>
                  <span class="font-bold text-teal" style="font-size:0.95rem;">${ap.tokenNumber}</span>
                  <strong style="margin-left:6px; color:var(--navy-dark);">${ap.name}</strong>
                  <span class="text-xs text-muted" style="margin-left:4px;">(${ap.age}y, ${ap.gender ? ap.gender[0] : 'O'})</span>
                  <span class="badge badge-consulting" style="margin-left:6px; font-size:0.7rem;">In Consultation</span>
                </div>
              </div>

              <div style="display:flex; align-items:center; gap:10px;">
                <span class="consult-timer" title="Elapsed Consultation Time">${ap.elapsedMinutes || 0}m in room</span>
                <button class="btn btn-secondary btn-sm" ${isActionInFlight ? 'disabled' : ''} onclick="handleCompleteConsultation('${doc.id}', this)">Complete</button>
              </div>
            </div>
          `;
        }

        // Waiting Queue Rows
        let queueRows = doc.queue || [];
        if (searchQuery) {
          queueRows = queueRows.filter(p =>
            (p.tokenNumber && p.tokenNumber.toLowerCase().includes(searchQuery)) ||
            (p.name && p.name.toLowerCase().includes(searchQuery))
          );
        }

        let tableRowsHtml = '';
        if (queueRows.length === 0) {
          tableRowsHtml = `<tr><td colspan="9" class="text-center text-muted" style="padding: 24px;">No waiting patients in queue.</td></tr>`;
        } else {
          tableRowsHtml = queueRows.map(p => {
            let catBadge = `<span class="badge badge-walkin">Walk-in</span>`;
            if (p.category === 'Emergency') catBadge = `<span class="badge badge-emergency">Emergency</span>`;
            else if (p.category === 'Scheduled') catBadge = `<span class="badge badge-scheduled">Scheduled</span>`;

            const sevPill = `<span class="sev-pill sev-pill-${p.severity}">Sev ${p.severity}</span>`;

            let extraBadges = '';
            if (p.severity === 5) {
              extraBadges += `<span class="badge badge-emergency" style="font-size:0.65rem; margin-left:4px;">Emergency Override</span>`;
            }
            if (p.fairnessBoost) {
              extraBadges += `<span class="badge badge-fairness" style="font-size:0.65rem; margin-left:4px;">Fairness Boost</span>`;
            }

            let waitedMinutes = p.estimatedWaitMinutes || 0;
            if (p.registeredAt && cachedClock && cachedClock.currentTime) {
              const regTime = new Date(p.registeredAt);
              waitedMinutes = Math.max(0, Math.floor((cachedClock.currentTime.getTime() - regTime.getTime()) / 60000));
            }

            return `
              <tr class="queue-row ${p.severity === 5 ? 'row-emergency' : ''}" id="row-${p.tokenNumber}">
                <td class="font-bold">#${p.position}</td>
                <td>
                  <strong class="text-teal">${p.tokenNumber}</strong>
                  ${extraBadges}
                </td>
                <td>
                  <span class="font-semibold">${p.name}</span>
                  <span class="text-xs text-muted">(${p.age}y)</span>
                </td>
                <td>${catBadge}</td>
                <td>${sevPill}</td>
                <td class="font-bold" style="color:var(--navy-dark);">${p.score || '—'}</td>
                <td class="text-xs text-muted">${waitedMinutes}m</td>
                <td class="font-semibold text-sm">${p.estimatedTimeStr || p.estimatedStartTime || '—'}</td>
                <td>
                  <div style="display:flex; align-items:center; gap:6px;">
                    <a href="token-slip.html?token=${encodeURIComponent(p.tokenNumber)}" class="action-btn-link" title="View Print Slip">Slip</a>
                    <button class="action-btn-link" ${isActionInFlight ? 'disabled' : ''} onclick="handleSkipPatient('${p.tokenNumber}', this)" title="Move to back of queue">Skip</button>
                    <button class="action-btn-link action-btn-danger" ${isActionInFlight ? 'disabled' : ''} onclick="handleMarkNoShow('${p.tokenNumber}', this)" title="Mark patient as No-Show">No-Show</button>
                  </div>
                </td>
              </tr>
            `;
          }).join('');
        }

        return `
          <div class="doctor-queue-column">
            <div class="queue-column-header">
              <div class="doc-headline">
                <h3>${doc.name}</h3>
                <span class="text-xs text-muted">${doc.department} • ${doc.room}</span>
              </div>
              <div style="display:flex; align-items:center; gap:8px;">
                <span class="badge badge-scheduled">${doc.queue ? doc.queue.length : 0} Waiting</span>
                ${statusBadge}
              </div>
            </div>

            ${activePatientBanner}

            <div class="table-container" style="border:none; border-radius:0;">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Pos</th>
                    <th>Token</th>
                    <th>Patient</th>
                    <th>Category</th>
                    <th>Severity</th>
                    <th>Score</th>
                    <th>Waited</th>
                    <th>Est. Start</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody>
                  ${tableRowsHtml}
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');
    }

    // 7. Render Explanation Log Feed
    function renderExplanationLog() {
      const container = document.getElementById('log-feed-container');
      const badge = document.getElementById('log-count-badge');
      if (!container) return;

      let events = cachedEvents;
      if (currentDoctorFilter !== 'All') {
        events = events.filter(e => e.doctorId === currentDoctorFilter);
      }

      if (badge) badge.textContent = `${events.length} Events`;

      if (events.length === 0) {
        container.innerHTML = `<div class="text-center text-muted p-4">No events logged yet.</div>`;
        return;
      }

      container.innerHTML = events.map(evt => {
        let iconClass = `log-type-${evt.type}`;
        let iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>`;

        if (evt.type === 'EMERGENCY_OVERRIDE') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>`;
        } else if (evt.type === 'FAIRNESS_BOOST') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"></path></svg>`;
        } else if (evt.type === 'MOVED_UP') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="19" x2="12" y2="5"></line><polyline points="5 12 12 5 19 12"></polyline></svg>`;
        } else if (evt.type === 'MOVED_DOWN') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>`;
        } else if (evt.type === 'COMPLETED') {
          iconSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        }

        const time = evt.timestamp ? new Date(evt.timestamp).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true }) : '';

        return `
          <div class="log-entry-item">
            <div class="log-icon-pill ${iconClass}">
              ${iconSvg}
            </div>
            <div style="flex:1;">
              <div style="display:flex; justify-content:space-between; margin-bottom:2px;">
                <strong style="color:var(--navy-dark); font-size:0.75rem;">${evt.tokenNumber || 'Queue'}</strong>
                <span class="log-time-stamp">${time}</span>
              </div>
              <div style="color:var(--text-main); font-size:0.75rem; line-height:1.35;">${evt.reason}</div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 8. Action Handlers with Double Submit Protection
    async function handleCallNext(doctorId, btnEl) {
      if (isActionInFlight) return;
      isActionInFlight = true;
      if (btnEl) btnEl.disabled = true;

      try {
        const res = await SmartOPDApi.post('/api/doctors/' + encodeURIComponent(doctorId) + '/call-next');
        const patient = SmartOPDAdapters.adaptQueuePatient(res);
        SmartOPD.showToast('Patient Called', `Token ${patient.tokenNumber} called into consultation room.`, 'success');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Call Action Blocked', err.message || 'Cannot call patient', 'warning');
      } finally {
        isActionInFlight = false;
        if (btnEl) btnEl.disabled = false;
      }
    }

    async function handleCompleteConsultation(doctorId, btnEl) {
      if (isActionInFlight) return;
      isActionInFlight = true;
      if (btnEl) btnEl.disabled = true;

      try {
        const res = await SmartOPDApi.post('/api/doctors/' + encodeURIComponent(doctorId) + '/complete');
        const patient = SmartOPDAdapters.adaptQueuePatient(res);
        SmartOPD.showToast('Consultation Completed', `Completed visit for ${patient.tokenNumber}.`, 'success');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Action Failed', err.message || 'Cannot complete consultation', 'error');
      } finally {
        isActionInFlight = false;
        if (btnEl) btnEl.disabled = false;
      }
    }

    async function handleMarkNoShow(tokenNumber, btnEl) {
      if (!confirm(`Mark token ${tokenNumber} as No-Show and remove from queue?`)) return;
      if (isActionInFlight) return;
      isActionInFlight = true;
      if (btnEl) btnEl.disabled = true;

      try {
        await SmartOPDApi.post('/api/patients/' + encodeURIComponent(tokenNumber) + '/no-show');
        SmartOPD.showToast('Marked No-Show', `Token ${tokenNumber} removed. Queue slot freed.`, 'info');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Error', err.message || 'Failed to mark no-show', 'error');
      } finally {
        isActionInFlight = false;
        if (btnEl) btnEl.disabled = false;
      }
    }

    async function handleSkipPatient(tokenNumber, btnEl) {
      if (isActionInFlight) return;
      isActionInFlight = true;
      if (btnEl) btnEl.disabled = true;

      try {
        await SmartOPDApi.post('/api/patients/' + encodeURIComponent(tokenNumber) + '/skip', { reason: 'Skipped by staff request' });
        SmartOPD.showToast('Patient Skipped', `Token ${tokenNumber} moved down for this round.`, 'info');
        await refreshImmediately();
      } catch (err) {
        SmartOPD.showToast('Error', err.message || 'Failed to skip patient', 'error');
      } finally {
        isActionInFlight = false;
        if (btnEl) btnEl.disabled = false;
      }
    }

    // Search Listener
    document.getElementById('queue-search-input').addEventListener('input', () => {
      renderQueueColumns();
    });

    // Retry Button Listener
    const btnRetryQm = document.getElementById('btn-retry-qm');
    if (btnRetryQm) {
      btnRetryQm.addEventListener('click', () => {
        refreshImmediately();
      });
    }

    // Start Visibility-aware Polling every 5s
    SmartOPDApi.poll(
      fetchAllData,
      5000,
      (data) => {
        const errBox = document.getElementById('qm-error-state');
        if (errBox) errBox.style.display = 'none';
        cachedQueues = data.queues;
        cachedClock = data.clock;
        cachedEvents = data.events;
        renderAll();
      },
      (err) => {
        const errBox = document.getElementById('qm-error-state');
        const errMsg = document.getElementById('qm-error-msg');
        if (cachedQueues.length === 0 && errBox) {
          errBox.style.display = 'block';
          if (errMsg) errMsg.textContent = err.message || 'Cannot connect to queue service.';
        }
      },
      (isReconnecting) => {
        const banner = document.getElementById('qm-reconnecting-banner');
        if (banner) banner.style.display = isReconnecting ? 'block' : 'none';
      }
    );
  </script>
</body>
</html>
