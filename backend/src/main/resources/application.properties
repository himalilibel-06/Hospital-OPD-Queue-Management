server.port=8080
server.address=0.0.0.0

# Database Path (default data/smartopd.db relative to backend folder)
smartopd.db.path=data/smartopd.db

# Jackson Date Formatting: ISO-8601 strings (not timestamps)
spring.jackson.serialization.write-dates-as-timestamps=false

# Static resources: live frontend folder for dev, bundled classpath:/static/ for standalone jar
spring.web.resources.static-locations=file:../frontend/,classpath:/static/
